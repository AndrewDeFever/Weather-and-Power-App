name: Portfolio CI

on:
  push:
    branches: ["portfolio-finalization"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install pip-audit

      - name: Runtime dependency checks
        run: |
          python -c "from cryptography.hazmat.primitives.ciphers.aead import AESGCM; print(AESGCM.__name__)"

      - name: Syntax and import checks
        run: |
          python -m compileall -q app tests
          ruff check --select=E9,F63,F7,F82 app tests

      - name: Frontend contract checks
        shell: bash
        run: |
          set -euo pipefail
          node --check frontend/static/app.js
          test -s frontend/index.html
          test -s frontend/static/styles.css
          grep -q 'SubReal Studios' frontend/index.html
          grep -q 'const API_ENDPOINT = "/api/status"' frontend/static/app.js
          grep -q 'DEMO_TUL_01' frontend/static/app.js
          ! grep -RniE 'ONE Gas|one-gas|CRPOK|CRPTX|Comm Outage PRB|Field Services|Optimum|Suddenlink|Telecom - Data|Physical Security' frontend

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q tests

      - name: Audit Python dependencies
        run: |
          pip-audit --no-deps -r requirements.txt -r requirements-dev.txt

      - name: Publish-safety scan
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          roots = [pathlib.Path("app"), pathlib.Path("frontend"), pathlib.Path("tests"), pathlib.Path(".github")]
          text_suffixes = {".py", ".json", ".html", ".css", ".js", ".yml", ".yaml", ".md", ".txt"}
          self_path = pathlib.Path(".github/workflows/portfolio-ci.yml")
          patterns = {
              "employer branding": re.compile(r"ONE\s+Gas|onegas\.com", re.I),
              "private key material": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "hardcoded AWS account ARN": re.compile(r"arn:aws:[^:\s]+:[^:\s]*:\d{12}:"),
              "hardcoded ECR registry": re.compile(r"\b\d{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com\b", re.I),
          }

          findings = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if path == self_path:
                      continue
                  if not path.is_file() or path.suffix.lower() not in text_suffixes:
                      continue
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  for label, pattern in patterns.items():
                      if pattern.search(text):
                          findings.append(f"{path}: {label}")

          if findings:
              print("Publish-safety findings:")
              print("\n".join(findings))
              sys.exit(1)

          print("Publish-safety scan passed")
          PY
