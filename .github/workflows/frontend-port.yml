name: SubReal Frontend Port

on:
  push:
    branches: ["portfolio-finalization"]
    paths:
      - ".migration/frontend_chunks/**"
      - ".github/workflows/frontend-port.yml"

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify transport chunks
        shell: bash
        run: |
          set -euo pipefail
          echo "3e97d11b4989e8a28916b65090933943f0cc9eca45c006b178269369cdf7199e  .migration/frontend_chunks/chunk_00" | sha256sum -c -
          echo "855e9e6d47429589bb69248cf2d1e74f49103cc351b8b19079b3c49f085dfc03  .migration/frontend_chunks/chunk_01" | sha256sum -c -
          echo "c9e0ae7e4aa0d6808928d7ebb11ac136fe561baa5526b06457702e28b2813e43  .migration/frontend_chunks/chunk_02" | sha256sum -c -
          echo "c73aaca755831dd302eeb982dee9644c8bcab7ee851b8af741b392d1c6f4fe40  .migration/frontend_chunks/chunk_03" | sha256sum -c -
          echo "2dd606445fb6fede4523e1a96d6a5e89e49ad40e1306db751763e60dc7d1b54f  .migration/frontend_chunks/chunk_04" | sha256sum -c -
          echo "c2b4242a3611970e7ea6d2ac0f199ce72ed715c9a4231afab686760798ff1325  .migration/frontend_chunks/chunk_05" | sha256sum -c -
          cat .migration/frontend_chunks/chunk_00 .migration/frontend_chunks/chunk_01 .migration/frontend_chunks/chunk_02 .migration/frontend_chunks/chunk_03 .migration/frontend_chunks/chunk_04 .migration/frontend_chunks/chunk_05 > /tmp/subreal_frontend.tar.gz.b64
          test "$(wc -c < /tmp/subreal_frontend.tar.gz.b64)" -eq 20444
          echo "b745cadf857345b4628dc730425b802ad9e4d8f3484ebe0d5ebe19ecead22bcb  /tmp/subreal_frontend.tar.gz.b64" | sha256sum -c -

      - name: Reconstruct sanitized production frontend
        shell: bash
        run: |
          set -euo pipefail
          base64 -d /tmp/subreal_frontend.tar.gz.b64 > /tmp/subreal_frontend.tar.gz
          echo "07a6695c2554e295106d0bd976cd15497cefbce049d60dfcb47003a55608ee3e  /tmp/subreal_frontend.tar.gz" | sha256sum -c -
          rm -rf /tmp/subreal_frontend
          mkdir -p /tmp/subreal_frontend
          tar -xzf /tmp/subreal_frontend.tar.gz -C /tmp/subreal_frontend
          echo "389f83619f7fff70c54b1600f424e3dd3baf0e1e61cce020fe3936104d17ae30  /tmp/subreal_frontend/index.html" | sha256sum -c -
          echo "f4a5dee6b01450cec8e3b10fc09b11d0b3a639f0a23e176e342a51b1db601732  /tmp/subreal_frontend/static/app.js" | sha256sum -c -
          echo "4ecf9ade307517dd45db261b66feb50b0f3db1d82dc35799d98ee2fdcfc715d2  /tmp/subreal_frontend/static/styles.css" | sha256sum -c -

      - name: Validate frontend
        shell: bash
        run: |
          set -euo pipefail
          node --check /tmp/subreal_frontend/static/app.js
          test -s /tmp/subreal_frontend/index.html
          test -s /tmp/subreal_frontend/static/styles.css
          grep -q 'SubReal Studios' /tmp/subreal_frontend/index.html
          grep -q 'const API_ENDPOINT = "/api/status"' /tmp/subreal_frontend/static/app.js
          ! grep -RniE 'ONE Gas|one-gas|CRPOK|CRPTX|Comm Outage PRB|Field Services|Optimum|Suddenlink|Telecom - Data|Physical Security' /tmp/subreal_frontend

      - name: Install frontend and clean migration material
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/subreal_frontend/index.html frontend/index.html
          cp /tmp/subreal_frontend/static/app.js frontend/static/app.js
          cp /tmp/subreal_frontend/static/styles.css frontend/static/styles.css
          rm -rf .migration
          rm -f .github/workflows/frontend-port.yml

      - name: Commit verified frontend
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: port production frontend as SubReal Studios"
          git push origin HEAD:portfolio-finalization
