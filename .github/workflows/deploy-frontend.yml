name: "Deploy Weather-and-Power Frontend Only"

on:
  workflow_dispatch: {}

concurrency:
  group: "weather-power-status-deploy"
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: "Validate frontend"
        shell: bash
        run: |
          set -euo pipefail

          node --check frontend/static/app.js
          node --check frontend/static/vendor/leaflet/leaflet-assets.js

          test -s frontend/index.html
          test -s frontend/static/app.js
          test -s frontend/static/styles.css
          test -s frontend/static/electric-theme.css
          test -s frontend/static/subreal-weather-logo.png
          test -s frontend/static/electric-storm-tile.png

          test "$(git hash-object frontend/static/vendor/leaflet/leaflet.js)" = "a3bf693d0fcaff885cc5f21b3a699aaa567b3533"
          test "$(git hash-object frontend/static/vendor/leaflet/leaflet.css)" = "5bffc1c0fcc3ab724643f94f978d1bd23244d690"
          test "$(git hash-object frontend/static/vendor/leaflet/leaflet-assets.js)" = "401b76c9e535928559245416c6662d4067827e0d"
          grep -q 'Version: 1.9.4' frontend/static/vendor/VENDORED_DEPENDENCIES.md
          grep -q 'License: BSD-2-Clause' frontend/static/vendor/VENDORED_DEPENDENCIES.md

          grep -q 'const API_ENDPOINT = "/api/status"' frontend/static/app.js
          grep -q 'id="forecastMap"' frontend/index.html
          grep -q 'data-forecast-layer="weather"' frontend/index.html
          grep -q 'id="forecastTimeSlider"' frontend/index.html
          grep -q '/static/vendor/leaflet/leaflet.js?v=1.9.4' frontend/index.html

          if grep -qE 'unpkg\.com/leaflet|cdn\.jsdelivr\.net/.*/leaflet|cdnjs\.cloudflare\.com/.*/leaflet' frontend/index.html; then
            echo "Leaflet must remain locally hosted."
            exit 1
          fi

          if grep -RniE 'Raw JSON|tab_raw|t_raw|id="raw"' frontend/index.html frontend/static/app.js; then
            echo "User-facing raw diagnostics must not be exposed."
            exit 1
          fi

          if grep -qE 'Loading NOAA|Loading NDFD|NOAA NDFD categorical legend|Forecast Hazards' frontend/index.html frontend/static/app.js; then
            echo "Source plumbing and legacy labels must stay out of the visible UI."
            exit 1
          fi

      - name: "Configure AWS credentials (OIDC)"
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: "Deploy frontend to S3"
        shell: bash
        run: |
          set -euo pipefail

          aws s3 sync frontend/static "s3://${FRONTEND_BUCKET}/static" \
            --delete \
            --only-show-errors \
            --cache-control "no-cache, no-store, must-revalidate"

          aws s3 cp frontend/index.html "s3://${FRONTEND_BUCKET}/index.html" \
            --only-show-errors \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: "Invalidate CloudFront frontend cache"
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/" "/index.html" "/static/*" \
            --no-cli-pager >/dev/null
          echo "CloudFront invalidation submitted for frontend paths."

      - name: "Warn when CloudFront invalidation is not configured"
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID == '' }}
        run: echo "::warning::CLOUDFRONT_DISTRIBUTION_ID is not configured; frontend cache invalidation was skipped."

      - name: "Frontend deployment complete"
        run: echo "Frontend-only deployment workflow completed."
