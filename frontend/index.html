<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SubReal Studios | Weather & Power Status</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=20260906b">
  <link rel="stylesheet" href="/static/styles.css?v=20260906b">
  <style>
    /* Allow the body background to grow with populated result content. */
    html { min-height: 100%; }
    body { height: auto; min-height: 100vh; }

    /* Weather & Power charged-cloud identity. */
    .brand {
      min-width: 320px;
      gap: 14px;
      align-items: center;
    }
    .mark {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: transparent;
      box-shadow: none;
      overflow: visible;
      flex: 0 0 auto;
    }
    .mark::before { content: none; }
    .mark img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 8px 18px rgba(34, 211, 238, .32));
    }
    .titlewrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
      line-height: 1.02;
      min-width: 0;
    }
    .title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: .15px;
      background: linear-gradient(90deg, #ffffff 0%, #dcecff 30%, #89e7ff 72%, #7c73ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 16px rgba(34, 211, 238, .18);
      white-space: nowrap;
    }
    .brand, .titlewrap { min-width: 0; }
    .subtitle {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: #8fe8f2;
      margin-top: 0;
      white-space: nowrap;
    }
    .brand-tagline {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--muted) 72%, #d8e6fb 28%);
      white-space: nowrap;
    }
    html[data-theme="dark"] .brand-tagline {
      color: color-mix(in srgb, #b4c4db 74%, #d8e6fb 26%);
      text-shadow: 0 0 12px rgba(102, 92, 246, .16);
    }
    html:not([data-theme="dark"]) .title {
      background: linear-gradient(90deg, #1f2933 0%, #254d7f 36%, #176b93 68%, #665cf6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      text-shadow: none;
    }
    html:not([data-theme="dark"]) .subtitle {
      color: #2563eb;
    }
    @media (max-width: 1240px) {
      .brand { min-width: 280px; }
      .title { font-size: 16px; }
      .subtitle { letter-spacing: .2em; }
      .brand-tagline { letter-spacing: .14em; }
    }
    @media (max-width: 980px) {
      .brand {
        min-width: 0;
        gap: 10px;
      }
      .mark {
        width: 48px;
        height: 48px;
      }
      .title {
        font-size: 16px;
      }
      .subtitle {
        font-size: 10px;
        letter-spacing: .18em;
      }
      .brand-tagline {
        display: none;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="container">
      <div class="header-row">
        <div class="brand" aria-label="SubReal Studios Weather and Power Status">
          <div class="mark" title="Weather & Power" aria-hidden="true">
            <img src="/static/weather-power-mark.svg?v=20260906b" alt="" />
          </div>
          <div class="titlewrap">
            <div class="title">SubReal Studios</div>
            <div class="subtitle">Weather &amp; Power</div>
            <div class="brand-tagline">Real Conditions. Real Impact.</div>
          </div>
        </div>

        <div class="searchwrap">
          <div class="searchbar" role="search">
            <div class="search-input-wrap">
              <input
                id="q"
                class="input"
                type="text"
                inputmode="search"
                autocomplete="off"
                spellcheck="false"
                placeholder="Enter demo Site ID (e.g., DEMO_TUL_01) or coordinates"
              />
              <div id="suggestions" class="suggestions-dropdown" hidden aria-label="Search suggestions"></div>
            </div>
            <button id="btn" class="btn" type="button">Search</button>
          </div>
        </div>

        <div class="rightmeta">
          <div class="pill" title="Request status">
            <span id="statusDot" class="dot"></span>
            <span id="statusText">Idle</span>
          </div>
          <button
            id="themeToggle"
            class="theme-toggle"
            type="button"
            role="switch"
            aria-checked="false"
            aria-label="Toggle color theme"
            title="Toggle color theme"
          >
            <span class="theme-knob" aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <div class="statusline">
        <span>Tip:</span>
        <span><strong>Enter</strong> submits. <strong>Esc</strong> clears.</span>
      </div>

      <div id="toast" class="toast" role="status"></div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="hgroup">
        <div>
          <h1 id="headline">No query loaded</h1>
          <p id="subhead" class="hint">Submit a synthetic Site ID or coordinates to retrieve weather and outage proximity.</p>
        </div>
      </div>

      <div class="grid" aria-live="polite">
        <!-- Summary Cards -->
        <section class="card" aria-label="Location summary">
          <div class="accentline"></div>
          <div class="label"><span class="dot ok"></span> Location</div>
          <div id="c_loc" class="value">—</div>
          <div id="c_loc_meta" class="meta">—</div>
        </section>

        <section class="card" aria-label="Provider summary">
          <div class="accentline"></div>
          <div class="label"><span class="dot ok"></span> Utility / Provider</div>
          <div id="c_util" class="value">—</div>
          <div id="c_util_meta" class="meta">—</div>
        </section>

        <section class="card" aria-label="Weather summary">
          <div class="accentline"></div>
          <div class="label"><span id="wxDot" class="dot live"></span> Weather</div>
          <div id="c_wx" class="value">—</div>
          <div id="c_wx_meta" class="meta">—</div>
        </section>

        <section class="card" aria-label="Power summary">
          <div class="accentline"></div>
          <div class="label"><span id="pwrDot" class="dot"></span> Power</div>
          <div id="c_pwr" class="value">—</div>
          <div id="c_pwr_meta" class="meta">—</div>
        </section>

        <!-- Details Panel -->
        <section class="panel" aria-label="Details">
          <div class="tabs" role="tablist" aria-label="Details tabs">
            <button class="tab active" role="tab" aria-selected="true" aria-controls="tab_overview" id="t_overview" type="button">Overview</button>
            <button class="tab" role="tab" aria-selected="false" aria-controls="tab_power" id="t_power" type="button">Power</button>
            <button class="tab" role="tab" aria-selected="false" aria-controls="tab_weather" id="t_weather" type="button">Weather</button>
            <button class="tab" role="tab" aria-selected="false" aria-controls="tab_raw" id="t_raw" type="button">Raw JSON</button>

            <div style="margin-left:auto"></div>
          </div>

          <div class="actions">
            <button id="openGoogleMaps" class="linkbtn" type="button" disabled>Open in Google Maps</button>
            <button id="openOutageMap" class="linkbtn" type="button" disabled>Open Power Outage Map</button>
            <button id="openNwsMap" class="linkbtn" type="button" disabled>Open Weather Map</button>
          </div>

          <div class="panel-body">
            <div id="tab_overview" role="tabpanel" aria-labelledby="t_overview">
              <div id="ov_kv"></div>
            </div>

            <div id="tab_power" role="tabpanel" aria-labelledby="t_power" hidden>
              <div id="pwr_kv"></div>
            </div>

            <div id="tab_weather" role="tabpanel" aria-labelledby="t_weather" hidden>
              <div id="wx_kv"></div>
            </div>

            <div id="tab_raw" role="tabpanel" aria-labelledby="t_raw" hidden>
              <pre id="raw">(no data)</pre>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>
  <script src="/static/app.js?v=20260906b"></script>
</body>
</html>
